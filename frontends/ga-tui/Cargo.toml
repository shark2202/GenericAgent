[package]
name = "ga-tui"
version = "0.1.0"
edition = "2024"
description = "herdr-style TUI multiplexer for ga-core-cli: multi-runner panes, detach/reattach, keyboard+mouse, themes, tool-timeline+approval"
authors = ["GenericAgent"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }
anyhow = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
unicode-width = "0.2"
tui-input = "0.12"
